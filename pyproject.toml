[project]
name = "neuroasd"
version = "0.1.0"
description = "neuroasd — ABIDE brain connectivity and ASD classification"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.0",
    "numpy>=2.5.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    # Multi-agent framework powering the medresearch package (orchestrator + subagents).
    "orchestra-agents",
]

# orchestra is pulled straight from its public GitHub repo (tracks main).
# Pin a specific release later with `tag = "vX.Y.Z"` (or `rev = "<sha>"`) for
# reproducibility, or drop this block entirely once it's published to PyPI.
[tool.uv.sources]
orchestra-agents = { git = "https://github.com/aaron-zhlg/orchestra", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neuroasd", "autoresearch", "medresearch"]

[project.scripts]
train-gcn = "neuroasd.train:main"
eval-gcn = "neuroasd.eval:main"
loso-cv-gcn = "neuroasd.loso_cv:main"
explain-gcn = "neuroasd.explain:main"
linear-baseline = "neuroasd.linear_baseline:main"
# Multi-agent medical research system (medresearch package)
med-research = "medresearch.orchestrator:main"
med-litsearch = "medresearch.literature:main"
med-trials = "medresearch.trials:main"
